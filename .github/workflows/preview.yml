# OTA preview on every PR opened/synced against dev.
# Publishes the current branch's JS bundle to an EAS Update branch named
# after the git branch, and posts a QR code in the PR comment. Reviewers
# scan with a pre-installed `preview` channel build to load the PR's JS.
# JS-only — for native-touching branches use preview-native.yml instead.
name: preview
on:
  pull_request:
    branches:
      - dev

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write access needed so the preview action can post the QR comment.
      pull-requests: write
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is not set"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # Authenticate to GitHub Packages so the private @durin-tech/authz
        # dependency (see .npmrc → ${NODE_AUTH_TOKEN}) can be fetched;
        # without this npm ci 401s on GET .../@durin-tech/authz.
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Run linter
        run: npm run lint

      # --auto derives the EAS Update branch name and message from git,
      # so each PR ships to its own update branch automatically.
      - name: Create Preview
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto
