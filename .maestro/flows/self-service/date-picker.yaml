# The shared date picker (japa#407), on Holdings › Add document › Valid until.
#
# Opens the calendar, taps a day, and checks that the calendar closed and the
# field shows the day; then opens it again, checks a field tap closes it
# without a change, and that Done closes it.
#
# Why Add document and not a From/To pair: the e2e fixture (seli-backend
# `seed:e2e`) has no `date` / `date_range` intake question nor a date
# requirement answer, so no From/To field is reachable without a backend
# fixture change (out of scope for japa#407; see the issue's build report).
# Add document renders the very same component (`DateField`), so the pick /
# close / Done behaviour checked here is the one the From/To row uses.
#
# Nothing here saves the document, starts an AI review or a payment.
appId: ${APP_ID}
tags:
  - self-service
  - flag-any
---
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: ${E2E_EMAIL}

# The sheet by its link (the app is up: a warm link is routed).
- openLink: "durintech://holdings/add-document"
- extendedWaitUntil:
    visible:
      id: "addDocument\\.validUntil"
    timeout: 30000

# A day of this month that is not today (tapping the highlighted day fires no
# change on iOS; that case is Done's job). The cell's label ends in the day
# number ("Sunday, November 15") or is just the number, hence the regex.
- evalScript: ${output.day = new Date().getDate() === 15 ? 16 : 15}
- evalScript: ${output.dayRe = '(.*[^0-9])?' + output.day + '([^0-9].*)?'}

# ── 1. Open, pick a day → closed, the field shows it ─────────────────────────
- tapOn:
    id: "addDocument\\.validUntil"
- extendedWaitUntil:
    visible:
      id: "addDocument\\.validUntil\\.done"
    timeout: 10000
- tapOn:
    text: ${output.dayRe}
    childOf:
      id: "addDocument\\.validUntil\\.calendar"
- extendedWaitUntil:
    notVisible:
      id: "addDocument\\.validUntil\\.done"
    timeout: 10000
# The field's spoken label is "Valid until, <d> <Mon> <yyyy>".
- assertVisible:
    id: "addDocument\\.validUntil"
    text: ${'Valid until, ' + output.day + ' .*'}

# ── 2. Open again: a field tap closes it and changes nothing ─────────────────
- tapOn:
    id: "addDocument\\.validUntil"
- extendedWaitUntil:
    visible:
      id: "addDocument\\.validUntil\\.done"
    timeout: 10000
- tapOn:
    id: "addDocument\\.validUntil"
- extendedWaitUntil:
    notVisible:
      id: "addDocument\\.validUntil\\.done"
    timeout: 10000
- assertVisible:
    id: "addDocument\\.validUntil"
    text: ${'Valid until, ' + output.day + ' .*'}

# ── 3. Open again: Done keeps the highlighted (chosen) day and closes ────────
- tapOn:
    id: "addDocument\\.validUntil"
- tapOn:
    id: "addDocument\\.validUntil\\.done"
- extendedWaitUntil:
    notVisible:
      id: "addDocument\\.validUntil\\.done"
    timeout: 10000
- assertVisible:
    id: "addDocument\\.validUntil"
    text: ${'Valid until, ' + output.day + ' .*'}
