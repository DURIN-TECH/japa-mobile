# Sign-in with a wrong password (japa#361): the login error shows and the
# app stays on Log in. Account: the emulator-only e2e fixture client.
appId: ${APP_ID}
tags:
  - auth
  - flag-any
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-out.yaml
- tapOn:
    id: "welcome\\.login"
- tapOn:
    id: "login\\.email"
- inputText: ${E2E_EMAIL}
# Let the email keyboard's suggestion bar settle, then focus the password
# field, re-tapping if the first tap changed nothing (a run once typed the
# password into nowhere and signed in with an empty one).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "login\\.password"
    retryTapIfNoChange: true
- inputText: "not-the-password-e2e"
- tapOn:
    id: "login\\.submit"
# The screen raises an alert and shows the same message inline.
- extendedWaitUntil:
    visible: "Login failed"
    timeout: 30000
- tapOn: "OK"
- assertVisible:
    id: "login\\.error"
- assertVisible:
    id: "login\\.submit"
- assertVisible: "Welcome back"
- assertNotVisible:
    id: "screen\\.home"
