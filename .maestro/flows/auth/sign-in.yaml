# Sign-in (japa#361): welcome → Log in → email + password → Home.
# Account: the emulator-only e2e fixture client (E2E_EMAIL, from the runner).
appId: ${APP_ID}
tags:
  - auth
  - flag-any
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-out.yaml
- assertVisible:
    id: "welcome\\.login"
- tapOn:
    id: "welcome\\.login"
- assertVisible: "Welcome back"
- tapOn:
    id: "login\\.email"
- inputText: ${E2E_EMAIL}
# Let the email keyboard's suggestion bar settle, then focus the password
# field, re-tapping if the first tap changed nothing (a run once typed the
# password into nowhere and signed in with an empty one).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "login\\.password"
    retryTapIfNoChange: true
- inputText: ${PASSWORD}
- tapOn:
    id: "login\\.submit"
- runFlow: ../../subflows/after-sign-in.yaml
- assertVisible:
    id: "tab\\.home"
