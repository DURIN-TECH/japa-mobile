# Subflow: (re)launch the dev client on THIS run's Metro (japa#361).
#
# Every suite flow starts here, so it begins from a fresh JS state whatever
# the previous flow left behind. Notifications are pre-allowed so the system
# permission alert (asked after sign-in) does not cover the screen
# (sign-in.yaml also answers it if it shows anyway).
#
# Env (from the runner): APP_ID, DEV_CLIENT_URL (the dev client's
# exp+...://expo-development-client/?url=<this run's Metro> link).
# Ends on the welcome screen (signed out) or Home (signed in).
#
# The link is sent only once the dev client's launcher is up: a link that
# arrives while it is still starting got "Failed to load app" and then a
# dead app in the first full run.
#
# Known dev-client flake (QA of japa#375, ~1 in 8 relaunches): "There was a
# problem loading the project" / "Failed to load app" without a crash; a
# second load works. The LOAD step (not the flow) is retried once here by
# its own Reload button, and the retry leaves a screenshot named
# `load-retry` that the runner counts and reports in its summary.
#
# Never relies on a cold start THROUGH an app link (not routed by the dev
# client on iOS, japa#375/#371): app links are only opened once the app is
# up (warm).
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    stopApp: true
    permissions:
      notifications: allow
# The launcher ("Development servers"), or the app itself when the dev client
# reopened the last server on its own.
- extendedWaitUntil:
    visible: "(?i).*development servers.*|Seli|Welcome back|Good morning.*"
    timeout: 30000
    optional: true
- openLink: ${DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: "welcome\\.login|screen\\.home"
    timeout: 90000
    # (passes as soon as either screen is up; a load failure falls through
    # to the retry below and the final wait)
    optional: true
- runFlow:
    when:
      visible: "There was a problem loading the project.*"
    commands:
      - takeScreenshot: load-retry
      - tapOn: "Reload"
- extendedWaitUntil:
    visible:
      id: "welcome\\.login|screen\\.home"
    timeout: 90000
